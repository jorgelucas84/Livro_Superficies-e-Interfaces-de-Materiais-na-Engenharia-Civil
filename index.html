<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorteador Jackpot</title>
<style>
:root{--bg:#fff7e6;--card:#ffffff;--ink:#2a1b00;--mute:#7a6540;--line:#e7d5a8;--gold:#f5b800;--green:#1fa85a;--reel:#1b1230;--reelink:#ffd84d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150d26;--card:#21163a;--ink:#f6efe0;--mute:#b8a8d6;--line:#3a2a5e;--reel:#0b0618;--reelink:#ffd84d}}
:root[data-theme="dark"]{--bg:#150d26;--card:#21163a;--ink:#f6efe0;--mute:#b8a8d6;--line:#3a2a5e;--reel:#0b0618;--reelink:#ffd84d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.capa{display:block;margin:6px auto 14px;width:min(240px,60vw);height:auto;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.3);border:1px solid var(--line)}
h1{text-align:center;margin:8px 0 4px;font-size:clamp(26px,6vw,40px);letter-spacing:1px}
.sub{text-align:center;color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
select,input[type=file]{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;max-width:100%}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;background:var(--line);color:var(--ink)}
.machine{background:linear-gradient(180deg,var(--green),#0b5a2a);border-radius:22px;padding:18px;border:4px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.reels{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:var(--reel);border-radius:14px;padding:14px;min-height:110px;align-items:center}
.reel{width:clamp(44px,12vw,70px);height:clamp(70px,18vw,100px);background:#fff;color:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,10vw,64px);font-weight:800;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 14px rgba(0,0,0,.35)}
.reel.spin{filter:blur(1.2px);color:#555}
.reel.done{background:var(--reelink);animation:pop .35s}
.textdisp{color:var(--reelink);font-size:clamp(24px,6vw,44px);font-weight:800;text-align:center;word-break:break-word;padding:6px}
@keyframes pop{50%{transform:scale(1.15)}}
.winner{margin-top:14px;text-align:center;background:var(--reel);border-radius:14px;padding:14px;min-height:76px;color:var(--reelink)}
.winner .n{font-size:clamp(26px,7vw,46px);font-weight:800;word-break:break-word}
.winner .h{color:#c9b8ee;font-size:13px}
.go{display:block;margin:16px auto 0;font-size:20px;padding:14px 40px;background:var(--gold);color:#2a1b00;border-radius:999px;box-shadow:0 4px 0 #b88700}
.go:disabled{opacity:.5;cursor:not-allowed}
ol{margin:8px 0 0;padding-left:22px}
li{padding:3px 0}
.mute{color:var(--mute);font-size:13px}
.wrap{overflow-x:auto}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let rows=[],pool=[],spinning=false,history=[];
const $=id=>document.getElementById(id);
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};

function colName(i){let s='';i++;while(i>0){s=String.fromCharCode(65+(i-1)%26)+s;i=Math.floor((i-1)/26)}return s}

function load(data){
  rows=data.filter(r=>r&&r.some(c=>c!==undefined&&c!==''));
  if(!rows.length){$('info').textContent='Planilha vazia.';return}
  const first=rows[0];
  $('hdr').checked=isNaN(Number(first[0]))&&first[0]!==undefined;
  $('cfg').style.display='flex';
  fillCols();rebuild();
}
function fillCols(){
  const n=Math.max(...rows.slice(0,50).map(r=>r.length));
  const h=$('hdr').checked?rows[0]:[];
  let opts='';
  for(let i=0;i<n;i++)opts+=`<option value="${i}">${colName(i)}${h[i]?' – '+String(h[i]).slice(0,20):''}</option>`;
  $('colNum').innerHTML=opts;
  $('colName').innerHTML='<option value="-1">(nenhuma)</option>'+opts;
  const norm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  let ci=0,cn=n>1?1:-1;
  if($('hdr').checked){const H=h.map(norm);const a=H.findIndex(x=>x.includes('inscri'));const b=H.findIndex(x=>x.includes('nome'));if(a>=0)ci=a;if(b>=0)cn=b;}
  $('colNum').value=ci;$('colName').value=cn;
}
function rebuild(){
  const ci=+$('colNum').value,cn=+$('colName').value;
  const data=$('hdr').checked?rows.slice(1):rows;
  const all=data.filter(r=>r[ci]!==undefined&&r[ci]!=='').map(r=>({key:String(r[ci]).trim(),name:cn>=0&&r[cn]!==undefined?String(r[cn]).trim():''}));
  window.all=all;
  pool=all.filter(e=>!history.some(h=>h.key===e.key&&h.name===e.name)||!$('rem').checked);
  $('info').textContent=`${all.length} participantes carregados · ${pool.length} disponíveis para sorteio.`;
  $('go').disabled=!pool.length;
}
$('hdr').onchange=()=>{fillCols();rebuild()};
$('colNum').onchange=$('colName').onchange=$('rem').onchange=rebuild;

$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      load(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}));
    }catch(err){$('info').textContent='Não consegui ler esse arquivo.'}
  };
  r.readAsArrayBuffer(f);
};
$('demo').onclick=()=>{
  const nomes=['Ana','Bruno','Carla','Diego','Elisa','Fábio','Gabi','Hugo','Iara','João','Karen','Lucas','Marta','Nando','Olívia'];
  load([['Número','Nome'],...nomes.map((n,i)=>[String(i+1).padStart(3,'0'),n+' '+['Silva','Souza','Lima','Costa','Rocha'][i%5]])]);
};

function renderHist(){
  $('hist').innerHTML=history.map(h=>`<li><b>${esc(h.key)}</b>${h.name?' – '+esc(h.name):''}</li>`).join('');
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('clear').onclick=()=>{history=[];renderHist();rebuild()};

$('go').onclick=()=>{
  if(spinning||!pool.length)return;
  spinning=true;$('go').disabled=true;
  const win=pool[rnd(pool.length)];
  $('winner').innerHTML='<div class="h">Girando…</div>';
  const maxLen=Math.max(...window.all.map(e=>e.key.length));
  const box=$('reels');
  if(maxLen<=8){
    const chars=[...new Set(window.all.flatMap(e=>[...e.key]))];
    const key=win.key.padStart(maxLen,' ');
    box.innerHTML='';
    const els=[...key].map(()=>{const d=document.createElement('div');d.className='reel spin';box.appendChild(d);return d});
    const done=els.map(()=>false);
    const iv=setInterval(()=>els.forEach((d,i)=>{if(!done[i])d.textContent=chars[rnd(chars.length)]}),55);
    els.forEach((d,i)=>setTimeout(()=>{
      done[i]=true;d.textContent=key[i]===' '?'':key[i];d.className='reel done';
      if(i===els.length-1){clearInterval(iv);finish(win)}
    },1500+i*700));
  }else{
    box.innerHTML='<div class="textdisp"></div>';
    const t=box.firstChild;
    const iv=setInterval(()=>t.textContent=window.all[rnd(window.all.length)].key,60);
    setTimeout(()=>{clearInterval(iv);t.textContent=win.key;finish(win)},2800);
  }
};
function finish(win){
  history.push(win);renderHist();
  $('winner').innerHTML=`<div class="h">🎉 Sorteado${win.name?'':' (sem nome)'}</div><div class="n">${esc(win.name||win.key)}</div>`+(win.name?`<div class="h">Número ${esc(win.key)}</div>`:'');
  spinning=false;rebuild();
}
</script>
</body>
</html>
