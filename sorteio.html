<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel do sorteio · ANPET 2026</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2433;--mu:#6b7384;--ac:#0f4d3a;--onac:#fff;--ac2:#e3efe9;--bd:#e2ded5;--ok:#157a4a;--er:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b202b;--tx:#eef0f5;--mu:#98a0b3;--ac:#e0a92e;--onac:#1a1a1a;--ac2:#2a3a33;--bd:#2c3342;--ok:#4cc38a;--er:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.hd{display:flex;gap:16px;align-items:center;margin-bottom:18px}.hd img{width:80px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
h1{font:700 22px/1.2 Georgia,serif;margin:0 0 4px}
.kick{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:10px}
button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.days{display:flex;gap:8px;flex-wrap:wrap}.days button{flex:1;min-width:90px}
input[type=text],textarea{width:100%;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:8px;margin-top:8px}.row input{flex:1}
.stage{text-align:center;padding:28px 12px}
.name{font:700 clamp(26px,6vw,46px)/1.2 Georgia,serif;min-height:56px;word-break:break-word}
.name.spin{color:var(--mu)}.name.win{color:var(--ok)}
.big{background:var(--ac);color:var(--onac);border:0;font-size:20px;padding:14px 28px;border-radius:12px;margin-top:12px}
.meta{color:var(--mu);font-size:14px}
ol{padding-left:22px;margin:8px 0}li{padding:4px 0}
li button{padding:2px 8px;font-size:12px;margin-left:8px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--ac2);border-radius:99px;padding:3px 10px;font-size:13px}
.chip.out{opacity:.5;text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left}
h2{font-size:17px;margin:0 0 8px}.wrap{overflow-x:auto}
.hide{display:none}
</style>
</head>
<body>
<main>
<div class="hd">
  <img alt="Capa" src="capa.jpg">
  <div><div class="kick">Sorteio · ANPET 2026</div><h1>Superfícies e interfaces de materiais na Engenharia Civil</h1></div>
</div>
<div class="tabs"><button id="t1" class="on">Sorteio</button><button id="t2">Presenteados (23)</button></div>

<section id="p1">
  <div class="card">
    <h2>Inscritos</h2>
    <p class="meta">Cole o link da planilha publicada (CSV) e clique em <b>Atualizar inscritos</b>. Se preferir, cole os nomes na caixa (um por linha).</p>
    <input type="text" id="url" placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?output=csv">
    <div class="row"><button id="load">Atualizar inscritos</button><span class="meta" id="lmsg" style="align-self:center"></span></div>
    <textarea id="bulk" placeholder="Ou cole nomes aqui, um por linha" style="margin-top:8px"></textarea>
    <div class="row"><button id="addbulk">Adicionar nomes colados</button></div>
  </div>

  <div class="card"><div class="days" id="days"></div></div>
  <div class="card stage">
    <div class="meta" id="info"></div>
    <div class="name" id="name">—</div>
    <button class="big" id="draw">Sortear</button>
  </div>
  <div class="card">
    <h2>Ganhadores do dia</h2>
    <ol id="winners"></ol>
    <button id="copy">Copiar lista</button>
  </div>
  <div class="card">
    <h2>Lista de inscritos (<span id="cnt">0</span>)</h2>
    <div class="chips" id="chips"></div>
    <div class="row"><button id="reset">Zerar tudo</button></div>
  </div>
</section>

<section id="p2" class="hide">
  <div class="card wrap"><p class="meta" id="gcount"></p><table id="gt"></table></div>
</section>
</main>
<script>
const G=[["Luciano Specth","UFSM","RS"],["Lélio Brito","UFRGS","RS"],["João Victor Staub de Melo","UFSC","SC"],["Matheus David Inocente Domingos","UTFPR","PR"],["Kamilla Vasconcelos","USP-POLI","SP"],["Adalberto Faxina ou Patricia Osmari","USP-SC","SP"],["Francisco Thiago Sacramento Aragão","UFRJ","RJ"],["Patricio Jose Moreira Pires","UFES","ES"],["Luiz Guilherme Rodrigues de Mello","UnB/DNIT","DF"],["Ronderson Queiroz Hilário","UFMG","MG"],["Caroline Dias Amancio de Lima","UFBA","BA"],["Reuber Arrais Freire","UFPE","PE"],["Leda Lucena","UFCG","PB"],["Luciana de Figueirêdo Lopes Lucena","UFRN","RN"],["Alguém da região norte","",""],["Alguém da região norte","",""],["Luis Alberto do Nascimento","Petrobras","RJ"],["Lucas Dotto Bueno","UFSM","RS"],["Zila Mascarenhas","UFMA","MA"],["Marcos Lamha Rocha","Petrobras",""],["Cléber Faccin","TCE","SC"],["Andréia Raffler","Via Araucária",""],["Mario Sergio de Souza Almeida","UFRB/DNIT","BA"]];
const DAYS=["27","28","29"],PER=5,KEY="anpet-forms";
let S={url:"",people:[],win:{"27":[],"28":[],"29":[]},absent:[],given:[],day:"27"};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const k=n=>n.trim().toLowerCase().replace(/\s+/g," ");
const label=p=>p.i?`${p.n} · ${p.i}`:p.n;
const won=()=>DAYS.flatMap(d=>S.win[d]);
const pool=()=>S.people.filter(p=>!won().includes(p.n)&&!S.absent.includes(p.n));
const find=n=>S.people.find(p=>p.n===n)||{n,i:""};
const rnd=n=>{const a=new Uint32Array(1);const lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n};
let busy=false;

function parseCSV(t){const r=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==','){row.push(f);f=""}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);r.push(row);row=[];f=""}
    else f+=c}
  if(f||row.length){row.push(f);r.push(row)}return r}

function addPeople(list){
  let added=0;
  list.forEach(([n,i])=>{n=(n||"").trim();if(!n)return;
    if(S.people.some(p=>k(p.n)===k(n)))return;
    S.people.push({n,i:(i||"").trim()});added++});
  save();render();return added;
}

$("url").value=S.url||"";
$("load").onclick=async()=>{
  const u=$("url").value.trim();if(!u){$("lmsg").textContent="Cole o link primeiro.";return}
  $("lmsg").textContent="Carregando…";
  try{
    const res=await fetch(u,{cache:"no-store"});if(!res.ok)throw 0;
    const rows=parseCSV(await res.text()).slice(1);
    S.url=u;const a=addPeople(rows.map(r=>[r[0],r[1]]));
    $("lmsg").textContent=a?`+${a} novo(s)`:"Sem novos inscritos";
  }catch(e){$("lmsg").textContent="Não consegui ler o link. Confira se a planilha está publicada como CSV."}
};
$("addbulk").onclick=()=>{addPeople($("bulk").value.split("\n").map(s=>[s,""]));$("bulk").value=""};

function render(){
  $("days").innerHTML=DAYS.map(d=>`<button data-d="${d}" class="${S.day===d?"on":""}">${d}/out · ${S.win[d].length}/${PER}</button>`).join("");
  $("days").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(busy)return;S.day=b.dataset.d;$("name").textContent="—";$("name").className="name";save();render()});
  const w=S.win[S.day],left=PER-w.length;
  $("info").textContent=`${pool().length} concorrendo · faltam ${left} exemplar(es) no dia ${S.day}/out`;
  $("draw").disabled=busy||left<=0||pool().length===0;
  $("draw").textContent=left<=0?"Dia completo ✔":"Sortear";
  $("winners").innerHTML=w.map((n,i)=>`<li>${esc(label(find(n)))}<button data-i="${i}">ausente / refazer</button></li>`).join("")||`<li class="meta" style="list-style:none">Ninguém sorteado ainda.</li>`;
  $("winners").querySelectorAll("button").forEach(b=>b.onclick=()=>{const n=S.win[S.day].splice(+b.dataset.i,1)[0];S.absent.push(n);save();render()});
  $("cnt").textContent=S.people.length;
  const used=[...won(),...S.absent];
  $("chips").innerHTML=S.people.map(p=>`<span class="chip ${used.includes(p.n)?"out":""}">${esc(p.n)}</span>`).join("");
  $("gcount").textContent=`${S.given.length} de ${G.length} exemplares entregues`;
  $("gt").innerHTML="<tr><th>✔</th><th>#</th><th>Nome</th><th>Instituição</th><th>UF</th></tr>"+G.map((g,i)=>`<tr><td><input type="checkbox" data-i="${i}" ${S.given.includes(i)?"checked":""}></td><td>${i+1}</td><td>${esc(g[0])}</td><td>${esc(g[1])}</td><td>${esc(g[2])}</td></tr>`).join("");
  $("gt").querySelectorAll("input").forEach(c=>c.onchange=()=>{const i=+c.dataset.i;S.given=c.checked?[...S.given,i]:S.given.filter(x=>x!==i);save();render()});
}

$("draw").onclick=()=>{
  const p=pool();if(!p.length||busy)return;busy=true;$("draw").disabled=true;
  const el=$("name");el.className="name spin";
  const final=p[rnd(p.length)],t0=Date.now();
  (function tick(){
    if(Date.now()-t0<2200){el.textContent=p[rnd(p.length)].n;setTimeout(tick,70+(Date.now()-t0)/16)}
    else{el.textContent="🎉 "+final.n;el.className="name win";S.win[S.day].push(final.n);busy=false;save();render()}
  })();
};
$("copy").onclick=async()=>{const t=`Sorteio ${S.day}/out\n`+S.win[S.day].map((n,i)=>`${i+1}. ${label(find(n))}`).join("\n");try{await navigator.clipboard.writeText(t);$("copy").textContent="Copiado ✔"}catch(e){$("copy").textContent="Não foi possível copiar"}setTimeout(()=>$("copy").textContent="Copiar lista",1500)};
$("reset").onclick=()=>{if(confirm("Apagar inscritos, ganhadores e entregas deste aparelho?")){S={url:S.url,people:[],win:{"27":[],"28":[],"29":[]},absent:[],given:[],day:"27"};save();$("name").textContent="—";render()}};
$("t1").onclick=()=>{$("p1").classList.remove("hide");$("p2").classList.add("hide");$("t1").className="on";$("t2").className=""};
$("t2").onclick=()=>{$("p2").classList.remove("hide");$("p1").classList.add("hide");$("t2").className="on";$("t1").className=""};
render();
</script>
</body>
</html>
